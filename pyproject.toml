[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zentao-cli"
version = "0.1.0"
description = "Command-line client for Zentao Open Source Edition 21.7.5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4,<5",
  "rich>=13,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-mock>=3,<4",
  "respx>=0.21,<1",
]

[project.scripts]
zentao = "zentao_cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
